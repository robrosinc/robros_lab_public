[build-system]
requires = ["setuptools", "toml"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["source/robros_lab_public", "scripts"]
force-exclude = true
exclude = [
    ".git",
    ".github",
    ".vscode",
    "_isaac_lab",
    "build",
    "dist",
    "docs",
    "logs",
    "outputs",
    "third_party",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RET", "SIM", "UP"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["robros_lab_public"]
known-local-folder = ["config"]

[tool.pyright]

exclude = [
    "**/__pycache__",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]

typeCheckingMode = "off"
pythonVersion = "3.12"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

# Isaac Sim / Isaac Lab modules are often not resolvable by static analysis,
# so missing imports are ignored.
reportMissingImports = "none"
# This is required to ignore for type checks of modules with stubs missing.
reportMissingModuleSource = "none" # -> most common: prettytable in mdp managers

reportGeneralTypeIssues = "none"       # -> raises 218 errors (usage of literal MISSING in dataclasses)
reportOptionalMemberAccess = "none" # -> raises 8 errors
reportPrivateUsage = "none"
